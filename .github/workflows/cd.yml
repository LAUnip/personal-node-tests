name: Node CI/CD

on:
  push:
    branches:
      - main  

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install dependencies
        run: npm ci
    
      - name: Run rests
        run: npm test
    
      - name: Build application
        run: npm run build
    
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful!"
    
      