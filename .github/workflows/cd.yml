name: Node CI/CD

on:
  push:
    branches:
      - master  

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use npm 11.6.2
        run: npm install -g npm@11.6.2

      - name: Debug versions
        run: |
            node --version
            npm --version
            grep "@emnapi/core" package-lock.json || true
            grep "@emnapi/runtime" package-lock.json || true
        
      - name: Install dependencies
        run: npm ci install
    
      - name: Run rests
        run: npm test
    
      - name: Build application
        run: npm run build
    
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful!"
    
      